<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>FRAMESHIFT</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 18px; align-items: center; justify-content: center; background: #000; color: #ff8c2a; z-index: 10; transition: opacity .9s ease; letter-spacing: .45em; }
    #boot h1 { font-weight: 200; font-size: 30px; margin: 0; text-shadow: 0 0 22px rgba(255,140,42,.55); }
    #boot .bar { width: 280px; height: 2px; background: #141414; overflow: hidden; border-radius: 1px; }
    #boot .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #ff8c2a, #35d6ff); animation: slide 1.1s ease-in-out infinite; }
    #boot small { color: #35d6ff; letter-spacing: .3em; opacity: .6; font-size: 10px; }
    #boot pre { display: none; max-width: 80ch; margin: 0; padding: 14px 18px; border: 1px solid #ff3b30;
      color: #ff3b30; letter-spacing: 0; font-size: 12px; line-height: 1.5; white-space: pre-wrap; text-align: left; }
    #boot.failed .bar { display: none; }
    #boot.failed pre { display: block; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
  <script type="module" crossorigin src="/frameshift/assets/index-yJlrO1H-.js"></script>
</head>
<body>
  <div id="app"></div>
  <div id="boot"><h1>FRAMESHIFT</h1><div class="bar"><i></i></div><small>INITIALIZING FRAME SHIFT DRIVE</small><pre id="bootErr"></pre></div>
  <script>
    (function () {
      var boot = document.getElementById('boot')
      var out = document.getElementById('bootErr')
      var shown = false
      function fail(what) {
        if (shown || !boot || !out) return
        shown = true
        boot.classList.add('failed')
        boot.querySelector('small').textContent = 'FRAME SHIFT DRIVE FAILURE'
        out.textContent = what
      }
      window.addEventListener('error', function (e) {
        fail(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''))
      })
      window.addEventListener('unhandledrejection', function (e) {
        fail(String(e.reason && e.reason.stack || e.reason))
      })
      setTimeout(function () {
        if (!document.querySelector('#app canvas')) {
          fail('Renderer did not start within 20s.\n\nIf this page is served statically, it must be the Vite\nproduction build (npm run build -> dist/), not the repo\nroot: browsers cannot execute src/main.ts directly.\n\nIf WebGL2 is unavailable or disabled, that will also\nstop startup.')
        }
      }, 20000)
    })()
  </script>
</body>
</html>
